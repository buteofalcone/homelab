services:
  jellyfin:
    image: "${JELLYFIN_IMAGE:-jellyfin/jellyfin:10}"
    container_name: jellyfin
    restart: unless-stopped
    profiles:
      - jellyfin
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${JELLYFIN_PORT:-8096}:8096/tcp"
      - "7359:7359/udp"
    environment:
      TZ: "${TZ:-Europe/Madrid}"
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${BASE_DOMAIN:-home.arpa}"
    volumes:
      - /srv/appdata/jellyfin/config:/config
      - /srv/appdata/jellyfin/cache:/cache
      - /srv/storage/media:/media:ro
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"
