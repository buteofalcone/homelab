services:
  caddy:
    build:
      context: ..
      dockerfile: docker/caddy/Dockerfile
    image: homelab-caddy:2-cloudflare
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      BASE_DOMAIN: "${BASE_DOMAIN:-butenko.online}"
    volumes:
      - /opt/homelab/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/homelab/caddy.env:/run/secrets/caddy.env:ro
      - /srv/appdata/caddy/data:/data
      - /srv/appdata/caddy/config:/config
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"
