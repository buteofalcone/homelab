services:
  immich-server:
    image: "ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}"
    container_name: immich-server
    restart: unless-stopped
    profiles:
      - immich
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    environment:
      TZ: "${TZ:-Europe/Madrid}"
      DB_HOSTNAME: immich-database
      DB_USERNAME: postgres
      DB_PASSWORD: "${IMMICH_DB_PASSWORD}"
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - /srv/storage/photos:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-redis
      - immich-database
    healthcheck:
      disable: false
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  immich-machine-learning:
    image: "ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}"
    container_name: immich-machine-learning
    restart: unless-stopped
    profiles:
      - immich
    environment:
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - /srv/appdata/immich/model-cache:/cache
    healthcheck:
      disable: false
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  immich-redis:
    image: "docker.io/valkey/valkey:9@sha256:8436e10bc65c94886a91d4415b6a6dfa9cb5a306fb3b996e5bb67cd2b4854193"
    container_name: immich-redis
    restart: unless-stopped
    profiles:
      - immich
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  immich-database:
    image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
    container_name: immich-database
    restart: unless-stopped
    profiles:
      - immich
    environment:
      POSTGRES_PASSWORD: "${IMMICH_DB_PASSWORD}"
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /srv/appdata/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"
