services:
  immich-server:
    image: "ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.0.3}"
    container_name: immich-server
    restart: unless-stopped
    profiles:
      - immich
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    environment:
      TZ: "${TZ:-Europe/Madrid}"
      DB_HOSTNAME: immich-database
      DB_USERNAME: postgres
      DB_PASSWORD: "${IMMICH_DB_PASSWORD}"
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - "${IMMICH_UPLOAD_LOCATION:-/srv/storage/photos}:/data"
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-redis
      - immich-database
    healthcheck:
      disable: false
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging: &immich-logging
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  immich-machine-learning:
    image: "ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.0.3}"
    container_name: immich-machine-learning
    restart: unless-stopped
    profiles:
      - immich-ml-fallback
    environment:
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - /srv/appdata/immich/model-cache:/cache
    healthcheck:
      disable: false
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging: *immich-logging

  immich-redis:
    image: "docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
    container_name: immich-redis
    restart: unless-stopped
    profiles:
      - immich
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging: *immich-logging

  immich-database:
    image: "${IMMICH_DB_IMAGE:-ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23}"
    container_name: immich-database
    restart: unless-stopped
    profiles:
      - immich
    environment:
      POSTGRES_PASSWORD: "${IMMICH_DB_PASSWORD}"
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /srv/appdata/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging: *immich-logging
