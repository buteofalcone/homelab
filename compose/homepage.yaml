services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      HOMEPAGE_ALLOWED_HOSTS: "home.${BASE_DOMAIN:-home.arpa},${SERVER_IP:-192.168.1.130}:${HOMEPAGE_PORT:-3000},localhost:${HOMEPAGE_PORT:-3000},127.0.0.1:${HOMEPAGE_PORT:-3000}"
    volumes:
      - /srv/appdata/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "true"
