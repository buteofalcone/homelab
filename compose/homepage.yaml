services:
  homepage-docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: homepage-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      SERVICES: "0"
      TASKS: "0"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    depends_on:
      - homepage-docker-proxy
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      HOMEPAGE_ALLOWED_HOSTS: "home.${BASE_DOMAIN:-home.arpa},${SERVER_IP:-192.168.1.130}:${HOMEPAGE_PORT:-3000},localhost:${HOMEPAGE_PORT:-3000},127.0.0.1:${HOMEPAGE_PORT:-3000}"
      HOMEPAGE_VAR_SERVER_IP: "${SERVER_IP:-192.168.1.130}"
      HOMEPAGE_VAR_BASE_DOMAIN: "${BASE_DOMAIN:-home.arpa}"
    volumes:
      - /srv/appdata/homepage:/app/config
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "true"
