services:
  portainer:
    image: portainer/portainer-ce:lts@sha256:4d616db18cfeb5dd41a69c0958bc825c84483ea9cde1106eb82a5d26f3bd8b0e
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/appdata/portainer:/data
    networks:
      - homelab
    labels:
      com.centurylinklabs.watchtower.enable: "false"
