services:
  timemachine:
    build:
      context: .
      dockerfile: Dockerfile
    image: homelab-timemachine:debian13
    container_name: timemachine
    restart: unless-stopped
    profiles:
      - timemachine
    ports:
      - "445:445/tcp"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TIMEMACHINE_A1502_USER: tm-a1502
      TIMEMACHINE_A1466_USER: tm-a1466
      TIMEMACHINE_A1502_MAX_SIZE: "${TIMEMACHINE_A1502_MAX_SIZE:-100G}"
      TIMEMACHINE_A1466_MAX_SIZE: "${TIMEMACHINE_A1466_MAX_SIZE:-100G}"
    volumes:
      - ./smb.conf.template:/etc/samba/smb.conf.template:ro
      - /etc/homelab/timemachine/a1502-password:/run/secrets/a1502-password:ro
      - /etc/homelab/timemachine/a1466-password:/run/secrets/a1466-password:ro
      - /srv/storage/timemachine/a1502:/shares/a1502
      - /srv/storage/timemachine/a1466:/shares/a1466
    healthcheck:
      test: ["CMD-SHELL", "smbcontrol smbd ping >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
