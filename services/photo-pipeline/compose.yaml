services:
  photo-ai-db:
    image: "${PHOTO_AI_DB_IMAGE:-pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337}"
    container_name: photo-ai-db
    restart: unless-stopped
    profiles: [photo-ai]
    environment:
      POSTGRES_DB: photo_ai
      POSTGRES_USER: photo_ai
      POSTGRES_PASSWORD: "${PHOTO_AI_DB_PASSWORD}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /srv/appdata/photo-pipeline/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_ai -d photo_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    networks: [homelab]
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  photo-ai-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: homelab/photo-ai-api:1.0.0
    container_name: photo-ai-api
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    profiles: [photo-ai]
    environment:
      DATABASE_URL: "postgresql://photo_ai:${PHOTO_AI_DB_PASSWORD}@photo-ai-db:5432/photo_ai"
      PHOTO_AI_API_TOKEN: "${PHOTO_AI_API_TOKEN}"
      PHOTO_AI_PIPELINE_VERSION: "${PHOTO_AI_PIPELINE_VERSION:-1.0.0}"
      IMMICH_URL: "http://immich-server:2283"
      IMMICH_AI_API_KEY: "${IMMICH_AI_API_KEY}"
      PHOTO_AI_LOG_DIR: /logs
    volumes:
      - "${PHOTO_AI_LOG_DIR:-/srv/storage/wd3tb/ai/logs}:/logs"
    ports:
      - "${HP_TAILSCALE_IP:-100.65.83.35}:${PHOTO_AI_PORT:-8766}:8000"
    depends_on:
      photo-ai-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    networks: [homelab]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
