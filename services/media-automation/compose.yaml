services:
  qbittorrent:
    image: "${QBITTORRENT_IMAGE:-lscr.io/linuxserver/qbittorrent@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02}"
    container_name: qbittorrent
    restart: unless-stopped
    profiles:
      - media-automation
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"
      UMASK: "002"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - /srv/appdata/qbittorrent:/config
      - /srv/storage:/data
      - /etc/homelab/qbittorrent-password:/run/secrets/qbittorrent-password:ro
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    networks:
      - homelab
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          status="$$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" &&
          { [ "$${status}" = 200 ] || [ "$${status}" = 403 ]; }
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  sonarr:
    image: "${SONARR_IMAGE:-lscr.io/linuxserver/sonarr@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f}"
    container_name: sonarr
    restart: unless-stopped
    profiles:
      - media-automation
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"
      UMASK: "002"
    volumes:
      - /srv/appdata/sonarr:/config
      - /srv/storage:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8989/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  prowlarr:
    image: "${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr@sha256:2f3d31307beba3ba2dd226d191f5f5c14ee3b4d8b49277c64683f5ed97083179}"
    container_name: prowlarr
    restart: unless-stopped
    profiles:
      - media-automation
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"
      UMASK: "002"
    volumes:
      - /srv/appdata/prowlarr:/config
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9696/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  radarr:
    image: "${RADARR_IMAGE:-lscr.io/linuxserver/radarr@sha256:e35056574cdc695a9ee745aa1ecda9eab3842450bf4b7b8471b023790fa3861d}"
    container_name: radarr
    restart: unless-stopped
    profiles:
      - media-automation
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"
      UMASK: "002"
    volumes:
      - /srv/appdata/radarr:/config
      - /srv/storage:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:7878/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  seerr:
    image: "${SEERR_IMAGE:-ghcr.io/seerr-team/seerr:v3.2.0@sha256:c4cbd5121236ac2f70a843a0b920b68a27976be57917555f1c45b08a1e6b2aad}"
    container_name: seerr
    init: true
    restart: unless-stopped
    profiles:
      - media-automation
    environment:
      LOG_LEVEL: info
      TZ: "${TZ:-Europe/Madrid}"
      PORT: "5055"
    volumes:
      - /srv/appdata/seerr:/app/config
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
