---
- name: Configure HP homelab server
  hosts: homelab
  become: true

  vars:
    server_hostname: hp-server
    admin_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    homelab_root: /srv/homelab
    compose_root: /opt/homelab/compose
    timezone_name: Europe/Madrid

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ server_hostname }}"

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone_name }}"
      failed_when: false

    - name: Install base packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - openssh-server
          - ufw
          - unattended-upgrades
          - curl
          - ca-certificates
          - gnupg
          - git
          - vim
          - htop
          - btop
          - tree
          - jq
          - smartmontools
        state: present

    - name: Enable SSH
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started

    - name: Install Docker repository key
      ansible.builtin.shell: |
        set -e
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: docker
        append: true

    - name: Create homelab directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0755"
      loop:
        - "{{ homelab_root }}"
        - "{{ homelab_root }}/data"
        - "{{ homelab_root }}/backups"
        - "{{ homelab_root }}/logs"

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Allow Homepage
      community.general.ufw:
        rule: allow
        port: "3000"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Start initial Docker stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ compose_root }}"
      changed_when: true
